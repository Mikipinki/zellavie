<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>zellavie — لباس‌هایی برای روزهای قشنگ</title>

<!-- 🎀 فاویکون گیف -->
<link rel="icon" type="image/gif" href="icon.gif">
<link rel="shortcut icon" type="image/gif" href="icon.gif">
<link rel="apple-touch-icon" href="icon.gif">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Great+Vibes&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ed6f9e;
  --pink-soft:#ffd6e6;
  --deep:#52283a;
  --line:#f3d4e1;
  --cream:#fffafc;
  --shadow:0 24px 70px rgba(190,72,120,.13);
  --rainbow:linear-gradient(43deg,#4158D0 0%,#C850C0 46%,#FFCC70 100%);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{
  margin:0;
  background:var(--rainbow);
  background-attachment:fixed;
  color:var(--deep);
  font-family:Vazirmatn,sans-serif;
  overflow-x:hidden;
  min-height:100vh;
  position:relative;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at 50% 0%, rgba(255,255,255,.35), transparent 60%);
  pointer-events:none;
  z-index:0;
}
button,a{font:inherit}

/* ============================================================
   🖼️ bg.png — بک‌گراند دوم، full-screen، محو و ملایم
   ============================================================ */
.bg-layer{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
}
.bg-layer img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  opacity:.32;
  filter: blur(2.5px) saturate(1.05);
  transform: scale(1.04);
  user-select:none;
  -webkit-user-drag:none;
}
.bg-layer::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 20%, rgba(255,255,255,.35), transparent 55%),
    linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
}

/* صفحه */
.page{max-width:100%;margin:auto;position:relative;z-index:1}
.page-inner{max-width:1240px;margin:auto;padding:0 24px;position:relative;z-index:1}

.blob{position:absolute;filter:blur(2px);opacity:.35;pointer-events:none;z-index:0}
.blob.one{width:260px;height:260px;background:#ffd8e8;border-radius:46% 54% 60% 40%;top:80px;right:-100px}
.blob.two{width:220px;height:220px;background:#ffe8c9;border-radius:60% 40% 45% 55%;left:-100px;top:400px}

/* ---------- Nav / Logo ---------- */
.nav{
  height:96px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  position:relative;
  z-index:5;
}
/*.nav-logo-img{
  width: clamp(3rem, 9vw, 12rem);
  height: clamp(3rem, 9vw, 12rem);
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  filter: drop-shadow(0 4px 12px rgba(82,40,58,.4));
}*/
.logo{
  font-family:"Great Vibes","Pacifico",cursive;
  font-size:54px;
  line-height:1;
  color:#fff;
  text-decoration:none;
  direction:ltr;
  text-shadow:
    0 4px 22px rgba(82,40,58,.45),
    0 0 30px rgba(255,182,214,.6);
  letter-spacing:1px;
}

/* ============================================================
   🎀 Hero : دو ستونه — لوگو (fade) + حباب‌ها
   ============================================================ */
.hero{
  position:relative;
  width:100vw;
  margin-right:calc(50% - 50vw);
  margin-left:calc(50% - 50vw);
  padding:10px 24px 40px;
}
.hero-grid{
  max-width:1240px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  align-items:center;
}
.hero-art{
  position:relative;
  width:100%;
  aspect-ratio: 16 / 10;
  display:flex;
  align-items:center;
  justify-content:center;
  isolation:isolate;
}
.hero-art img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  user-select:none;
  -webkit-user-drag:none;

  -webkit-mask-image:
    linear-gradient(to right, transparent 0%, #000 15%, #000 85%, transparent 100%),
    linear-gradient(to bottom, transparent 0%, #000 15%, #000 85%, transparent 100%);
  -webkit-mask-composite: source-in;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-size: 100% 100%, 100% 100%;

  mask-image:
    linear-gradient(to right, transparent 0%, #000 15%, #000 85%, transparent 100%),
    linear-gradient(to bottom, transparent 0%, #000 15%, #000 85%, transparent 100%);
  mask-composite: intersect;
  mask-repeat: no-repeat;
  mask-size: 100% 100%, 100% 100%;

  filter: drop-shadow(0 20px 40px rgba(82,40,58,.18));
}

/* ============================================================
   🫧  Bubble text (Uiverse by Dennyhml) — pink theme + fade
   ============================================================ */
.hero-text{
  position:relative;
  width:100%;
  min-height:380px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  contain: layout paint;
  border-radius:28px;

  /* fade لبه‌های کادر حباب‌ها مثل لوگو */
  -webkit-mask-image:
    linear-gradient(to right, transparent 0%, #000 15%, #000 85%, transparent 100%),
    linear-gradient(to bottom, transparent 0%, #000 15%, #000 85%, transparent 100%);
  -webkit-mask-composite: source-in;
  -webkit-mask-repeat: no-repeat;
  -webkit-mask-size: 100% 100%, 100% 100%;

  mask-image:
    linear-gradient(to right, transparent 0%, #000 15%, #000 85%, transparent 100%),
    linear-gradient(to bottom, transparent 0%, #000 15%, #000 85%, transparent 100%);
  mask-composite: intersect;
  mask-repeat: no-repeat;
  mask-size: 100% 100%, 100% 100%;
}

.bubble-container{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  z-index:0;
  pointer-events:none;
}

/* محتوای متنی روی حباب‌ها */
.bubble-content{
  position:relative;
  z-index:5;
  text-align:right;
  padding:0 24px;
  max-width:520px;
  margin-right:auto;
  margin-left:24px;
  color:#fff;
  text-shadow:0 4px 24px rgba(82,40,58,.45);
}
.bubble-content h1{
  font-size: clamp(34px, 4.6vw, 64px);
  line-height:1.15;
  margin:0 0 18px;
  letter-spacing:-1.5px;
  font-weight:900;
  color:#fff;
  text-shadow:
    0 4px 26px rgba(82,40,58,.55),
    0 0 26px rgba(255,182,214,.55);
}
.bubble-content p{
  font-size: clamp(14px, 1.15vw, 17px);
  line-height:2.1;
  margin:0;
  color:rgba(255,255,255,.98);
  text-shadow:0 2px 14px rgba(82,40,58,.55);
}

/* حباب‌ها */
.bubble{
  position: absolute;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  box-shadow: inset 0 0 25px rgba(255, 255, 255, 0.25);
  animation: animate_4010 8s ease-in-out infinite;
}

.bubble:nth-child(2) {
  position: relative;
  zoom: 0.45;
  left: -10px;
  top: -100px;
  animation-delay: -4s;
}

.bubble:nth-child(3) {
  position: relative;
  zoom: 0.45;
  right: -80px;
  top: -300px;
  animation-delay: -6s;
}

.bubble:nth-child(4) {
  position: relative;
  zoom: 0.35;
  left: -120px;
  bottom: -200px;
  animation-delay: -3s;
}

.bubble:nth-child(5) {
  position: relative;
  zoom: 0.5;
  left: 0px;
  top: 200px;
  animation-delay: -5s;
}

@keyframes animate_4010 {
  0%,100% {
    transform: translateY(-20px);
  }
  50% {
    transform: translateY(20px);
  }
}

.bubble::before {
  content: '';
  position: absolute;
  top: 50px;
  left: 45px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #fff;
  z-index: 10;
  filter: blur(2px);
}

.bubble::after {
  content: '';
  position: absolute;
  top: 80px;
  left: 80px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  z-index: 10;
  filter: blur(2px);
}

.bubble span {
  position: absolute;
  border-radius: 50%;
}

/* رنگ‌ها به تم پینک/طلایی سایت */
.bubble span:nth-child(1) {
  inset: 10px;
  border-left: 15px solid #ed6f9e;
  filter: blur(8px);
}
.bubble span:nth-child(2) {
  inset: 10px;
  border-right: 15px solid #c850c0;
  filter: blur(8px);
}
.bubble span:nth-child(3) {
  inset: 10px;
  border-top: 15px solid #ffcc70;
  filter: blur(8px);
}
.bubble span:nth-child(4) {
  inset: 30px;
  border-left: 15px solid #ed6f9e;
  filter: blur(12px);
}
.bubble span:nth-child(5) {
  inset: 10px;
  border-bottom: 10px solid #ffffff;
  filter: blur(8px);
  transform: rotate(330deg);
}

/* ---------- خط جداکننده ---------- */
.divider{
  max-width:1240px;
  margin: 0 auto;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,.45) 20%,
    rgba(255,255,255,.45) 80%,
    transparent 100%
  );
}
.divider.tight{margin-top:8px}

/* ---------- Product grid ---------- */
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:32px 20px;
  padding:40px 0 90px;
  justify-items:center;
}

/* ---------- Product card ---------- */
.product-card{
  position:relative;
  background:linear-gradient(160deg,#ffd6e6 0%,#ffb3d1 100%);
  width:100%;
  max-width:230px;
  height:320px;
  cursor:pointer;
  transition:transform .3s ease, box-shadow .3s ease;
  box-shadow:0 6px 18px rgba(82,40,58,.25);
  border-radius:6px;
  color:var(--deep);
  font-family:Vazirmatn,sans-serif;
  overflow:visible;
}
.product-card:hover{
  transform:scale(1.04) rotate(-.5deg);
  box-shadow:0 18px 40px rgba(82,40,58,.35);
}
.product-card:active{
  transform:scale(1.04) translate(0,4%);
}
.shine{
  position:absolute;
  inset:0;
  overflow:hidden;
  border-radius:6px;
}
.shine-effect{
  position:absolute;
  top:-15%;
  left:150%;
  width:25px;
  height:400px;
  background-color:#ffffff2a;
  box-shadow:0 0 15px 2px #ffffff42;
  transform:rotate(25deg);
  transition:all 1s cubic-bezier(.78,.02,.5,.77);
  z-index:5;
}
.product-card:hover .shine-effect{left:-100%}
.pattern-1{position:absolute;top:0;left:0;width:125px;height:auto;z-index:2;pointer-events:none}
.pattern-2{position:absolute;top:-10%;left:-10%;width:200px;height:auto;z-index:2;pointer-events:none}
.tree{position:absolute;bottom:1%;right:-2%;width:100px;height:auto;transform-origin:100% 0;transform:rotate(-15deg);z-index:3;pointer-events:none}

.product-photo{
  position:absolute;
  top:10%;
  left:50%;
  transform:translate(-50%,0);
  width:78%;
  height:150px;
  background-color:#faf3e8;
  z-index:1;
  overflow:hidden;
  border-radius:4px;
  display:grid;
  place-items:center;
  box-shadow:inset 0 0 0 1px rgba(82,40,58,.08);
}
.product-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.product-photo .placeholder{
  font-size:60px;
  line-height:1;
}
.product-info{
  position:absolute;
  bottom:14px;
  left:12px;
  right:12px;
  z-index:4;
  text-align:center;
  color:#4a2233;
}
.product-info h3{
  font-size:14px;
  font-weight:900;
  margin:0 0 6px;
  line-height:1.35;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.product-info .price{
  display:inline-block;
  font-size:12px;
  font-weight:800;
  color:#b83d78;
  background:#fff;
  border:1px solid rgba(184,61,120,.25);
  padding:4px 10px;
  border-radius:999px;
  box-shadow:0 4px 10px rgba(184,61,120,.18);
}
.fil-pattern-1{fill:#fff0f5}
.fil-pattern-2{fill:#d94f8a;fill-rule:nonzero}
.fil0{fill:#d94f8a}
.empty{text-align:center;padding:100px 20px;color:#fff;grid-column:1/-1}

/* ---------- Product detail ---------- */
.detail{padding:40px 0 90px}
.back{color:#fff;text-decoration:none;font-weight:800;font-size:13px;text-shadow:0 2px 8px rgba(82,40,58,.3)}
.detail-wrap{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:start}
.gallery{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:35px;padding:14px;box-shadow:var(--shadow)}
.main-img{aspect-ratio:1/1.05;border-radius:25px;overflow:hidden;background:#fff0f5}
.main-img img{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:10px;overflow:auto;padding:12px 3px 2px}
.thumb{width:68px;height:76px;border:2px solid transparent;border-radius:14px;padding:0;background:#fff0f5;overflow:hidden;flex:0 0 auto;cursor:pointer}
.thumb.active{border-color:var(--pink)}
.thumb img{width:100%;height:100%;object-fit:cover}
.details{padding:20px 5px;background:rgba(255,255,255,.96);border-radius:30px;padding:25px;box-shadow:var(--shadow)}
.details .mini{font-size:12px;color:#b65c7d;font-weight:900}
.details h1{font-size:42px;line-height:1.2;margin:14px 0;color:var(--deep)}
.details .bigprice{font-size:25px;font-weight:900;color:var(--pink);margin:18px 0}
.desc{color:#795f6c;line-height:2.2;font-size:14px;background:#fff7fa;border:1px solid var(--line);padding:20px;border-radius:22px}
.order-wrap{margin-top:22px;display:flex;flex-wrap:wrap;gap:16px;justify-content:center}

/* ============================================================
   🌾  Rose Button (Uiverse by MuhammadHasann) — pink themed
   ============================================================ */
.rose-btn{
  position: relative;
  padding: 15px 45px;
  background: #ffd0e0;
  font-size: 15px;
  font-weight: 800;
  color: #52283a;
  cursor: pointer;
  border: 1px solid #ffd0e0;
  border-radius: 8px;
  filter: drop-shadow(2px 2px 3px rgba(82,40,58,.25));
  font-family: Vazirmatn, sans-serif;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  transition: 0.2s;
  white-space: nowrap;
}
.rose-btn:hover{
  border: 1px solid #f5b8ce;
  background: linear-gradient(85deg,#ffd0e0,#fcc8da,#f7bfd2,#f7c2d4,#f8c6d8);
  animation: rose-wind 2s ease-in-out infinite;
}
@keyframes rose-wind{
  0%{background-position:0% 50%}
  50%{background-position:50% 100%}
  100%{background-position:0% 50%}
}
.rose-btn .icon-1{
  position: absolute;
  top: 0;
  right: 0;
  width: 25px;
  transform-origin: 0 0;
  transform: rotate(10deg);
  transition: all 0.5s ease-in-out;
  filter: drop-shadow(2px 2px 3px rgba(82,40,58,.35));
  pointer-events: none;
}
.rose-btn:hover .icon-1{
  animation: rose-slay-1 3s cubic-bezier(0.52,0,0.58,1) infinite;
  transform: rotate(10deg);
}
@keyframes rose-slay-1{
  0%{transform:rotate(10deg)}
  50%{transform:rotate(-5deg)}
  100%{transform:rotate(10deg)}
}
.rose-btn .icon-2{
  position: absolute;
  top: 0;
  left: 25px;
  width: 12px;
  transform-origin: 50% 0;
  transform: rotate(10deg);
  transition: all 1s ease-in-out;
  filter: drop-shadow(2px 2px 3px rgba(82,40,58,.5));
  pointer-events: none;
}
.rose-btn:hover .icon-2{
  animation: rose-slay-2 3s cubic-bezier(0.52,0,0.58,1) 1s infinite;
  transform: rotate(0);
}
@keyframes rose-slay-2{
  0%{transform:rotate(0deg)}
  50%{transform:rotate(15deg)}
  100%{transform:rotate(0)}
}
.rose-btn .icon-3{
  position: absolute;
  top: 0;
  left: 0;
  width: 18px;
  transform-origin: 50% 0;
  transform: rotate(-5deg);
  transition: all 1s ease-in-out;
  filter: drop-shadow(2px 2px 3px rgba(82,40,58,.5));
  pointer-events: none;
}
.rose-btn:hover .icon-3{
  animation: rose-slay-3 2s cubic-bezier(0.52,0,0.58,1) 1s infinite;
  transform: rotate(0);
}
@keyframes rose-slay-3{
  0%{transform:rotate(0deg)}
  50%{transform:rotate(-5deg)}
  100%{transform:rotate(0)}
}
.rose-btn .icon-1 svg,
.rose-btn .icon-2 svg,
.rose-btn .icon-3 svg{width:100%;height:auto;display:block}
.rose-btn .icon-1 .fil0,
.rose-btn .icon-2 .fil0,
.rose-btn .icon-3 .fil0{fill:#b83d78}

/* ---------- Order page ---------- */
.order-page{min-height:75vh;display:grid;place-items:center;padding:60px 0}
.order-box{max-width:760px;width:100%;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:35px;padding:42px;box-shadow:var(--shadow);text-align:center}
.order-box h1{color:var(--deep);margin:10px 0}
.socials{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:28px}
.social{padding:20px;border:1px solid var(--line);border-radius:22px;text-decoration:none;color:var(--deep);background:#fff8fb;font-weight:900;transition:.25s;display:flex;flex-direction:column;align-items:center;gap:6px}
.social:hover{transform:translateY(-5px);background:#ffeaf2}
.social b{display:flex;align-items:center;justify-content:center;color:var(--pink);font-size:24px;margin-bottom:7px;width:38px;height:38px;border-radius:50%;background:#fff0f6}
.social b svg{width:22px;height:22px;fill:var(--pink)}
.social small{font-weight:600;color:#896878}

/* ---------- Footer ---------- */
.footer{
  text-align:center;
  padding:34px 20px 26px;
  border-top:1px solid rgba(255,255,255,.35);
  color:rgba(255,255,255,.95);
  font-size:12px;
  position:relative;
  z-index:1;
}
.footer .foot-socials{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-bottom:14px;
  flex-wrap:wrap;
}
.footer .foot-social{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  background:rgba(255,255,255,.92);
  color:#b83d78;
  border-radius:999px;
  font-weight:800;
  font-size:12px;
  text-decoration:none;
  transition:.25s;
  box-shadow:0 6px 16px rgba(82,40,58,.18);
}
.footer .foot-social:hover{transform:translateY(-3px);background:#fff}
.footer .foot-social svg{width:16px;height:16px;fill:#b83d78}
.footer .foot-social.disabled{opacity:.6;cursor:not-allowed}
.footer .foot-copy{opacity:.9}

/* ---------- 404 container (loads 404.html in an iframe) ---------- */
#notfound-container{
  position:fixed;
  inset:0;
  z-index:100;
  display:block;
  background:#090a0f;
  padding:0;
  margin:0;
  overflow:hidden;
}
#notfound-container iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

@media(max-width:900px){
  .nav{height:80px;gap:8px}
  .nav-logo-img{width:36px;height:36px}
  .logo{font-size:44px}
  .hero{padding:6px 20px 30px}
  .hero-grid{grid-template-columns:1fr;gap:22px}
  .hero-text{min-height:320px}
  .bubble-content{text-align:center;margin:0 auto;padding:0 16px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .detail-wrap{grid-template-columns:1fr}
  .details h1{font-size:32px}
}
@media(max-width:520px){
  .page-inner{padding:0 15px}
  .nav{height:72px;gap:6px}
  .nav-logo-img{width:30px;height:30px}
  .logo{font-size:34px}
  .hero{padding:4px 15px 22px}
  .hero-text{min-height:300px}
  .bubble-content h1{font-size:30px;letter-spacing:-.5px}
  .bubble-content p{font-size:13.5px;line-height:2}
  .grid{gap:20px 12px;padding:24px 0 60px}
  .socials{grid-template-columns:1fr}
  .order-box{padding:25px 16px}
  .rose-btn{padding:13px 32px;font-size:13.5px}
  .rose-btn .icon-1{width:20px}
  .rose-btn .icon-2{width:10px;left:20px}
  .rose-btn .icon-3{width:14px}
}
</style></head>
<body>

<!-- 🖼️ بک‌گراند دوم (bg.png) -->
<div class="bg-layer" aria-hidden="true" id="bgLayer"></div>

<div class="blob one"></div><div class="blob two"></div>
<div class="page">
<nav class="nav">
  <img class="nav-logo-img" src="logo2.png" alt="zellavie" onerror="this.style.display='none';">
  <a class="logo" href="#/">Zellavie</a>
</nav>
<main id="app"></main>
</div>
<footer class="footer" id="footer"></footer>
<script>
/* ============================================================
   ⚙️  CONFIGURATION — ONLY EDIT THIS SECTION

/* ---------- background ---------- */
function renderBg(){
  bgLayer.innerHTML = `<img src="${esc(BG_IMAGE)}" alt="" aria-hidden="true" onerror="this.parentNode.style.display='none';">`;
}

function md(text){
  let price="";
  const pm=text.match(/(?:قیمت|Price|price)\s*[:：]\s*([^\n]+)/i);
  if(pm){price=pm[1].trim();text=text.replace(pm[0],"")}
  let lines=text.split("\n").filter(x=>x.trim()),title="";
  if(lines[0]&&(/^[#]/.test(lines[0])||lines[0].length<70)){title=lines.shift().replace(/^#+\s*/,"").trim()}
  let html=esc(lines.join("\n"))
    .replace(/^### (.+)$/gm,"<h3>$1</h3>")
    .replace(/^## (.+)$/gm,"<h2>$1</h2>")
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\* (.+)$/gm,"• $1")
    .replace(/\n\n/g,"</p><p>")
    .replace(/\n/g,"<br>");
  return {title,price,html:"<p>"+html+"</p>"}
}
function parse(){
  products=tree.filter(n=>n.type==="dir").map(n=>{
    const files=n.children||[],m=files.find(f=>f.type==="file"&&f.name.toLowerCase().endsWith(".md"));
    const imgs=files.filter(f=>f.type==="file"&&/\.(jpg|jpeg|png|webp|gif|avif|svg)$/i.test(f.name)).map(f=>f.path);
    return {name:n.name,path:n.path,md:m?.path,images:imgs}
  }).filter(p=>p.md||p.images.length)
}
async function info(p){
  if(p.info)return p.info;
  let raw="";
  if(p.md)try{const r=await fetch(p.md);if(r.ok)raw=await r.text()}catch{}
  p.info=md(raw||p.name.replace(/[-_]/g," "));
  return p.info
}

function renderFooter(){
  const items = [
    {key:"instagram", label:"اینستاگرام", icon:ICONS.instagram, href:LINKS.instagram},
    {key:"bale",      label:"کانال بله",  icon:ICONS.bale,      href:LINKS.bale},
  ];
  const socialsHTML = items.map(it=>{
    if(has(it.href)){
      return `<a class="foot-social" href="${esc(it.href)}" target="_blank" rel="noopener" title="${esc(it.label)}">${it.icon}<span>${esc(it.label)}</span></a>`;
    }
    return `<a class="foot-social disabled" href="javascript:void(0)" data-disabled="1" title="${esc(it.label)}">${it.icon}<span>${esc(it.label)}</span></a>`;
  }).join("");
  footerEl.innerHTML = `
    <div class="foot-socials">${socialsHTML}</div>
    <div class="foot-copy">zellavie · دوخته شده برای روزهای قشنگ ♡</div>`;
  footerEl.querySelectorAll('[data-disabled="1"]').forEach(el=>{
    el.addEventListener("click",e=>{e.preventDefault();alert(LINK_ERROR)});
  });
}

function roseButtonHTML(label, href){
  const inner = `
    <div class="icon-1">${DECOR_SVG.one}</div>
    <div class="icon-2">${DECOR_SVG.two}</div>
    <div class="icon-3">${DECOR_SVG.three}</div>
    <span class="rose-label">${esc(label)}</span>`;
  if(has(href)){
    return `<a class="rose-btn" href="${esc(href)}" target="_blank" rel="noopener">${inner}</a>`;
  }
  return `<button type="button" class="rose-btn" data-disabled="1">${inner}</button>`;
}
function orderButtonsHTML(){
  return [
    roseButtonHTML("سفارش در بله",        LINKS.bale),
    roseButtonHTML("سفارش در اینستاگرام", LINKS.instagram)
  ].join("");
}
function bindOrderButtons(scope){
  scope.querySelectorAll('.rose-btn[data-disabled="1"]').forEach(btn=>{
    btn.addEventListener("click",e=>{e.preventDefault();alert(LINK_ERROR)});
  });
}

function home(){
  document.title="zellavie — لباس‌هایی برای روزهای قشنگ";
  const cards=products.map((p)=>cardHTML(p)).join("");
  app.innerHTML=`
    <div class="divider nav-divider"></div>
    <section class="hero">
      <div class="hero-grid">
        <div class="hero-art">
          <img src="${esc(HERO_IMAGE)}" alt="zellavie" onerror="this.style.display='none';">
        </div>
        <div class="hero-text">
          <div class="bubble-container" aria-hidden="true">
            <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
            <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
            <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
            <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
            <div class="bubble"><span></span><span></span><span></span><span></span><span></span></div>
          </div>
          <div class="bubble-content">
            <h1>دوخت لباس های راحت و جذاب</h1>
            <h4>برای استایل‌هایی که قرار نیست شبیه بقیه باشند. مجموعه‌ای از لباس‌های دوست‌داشتنی، لطیف و خاصِ zellavie.</h4>
          </div>
        </div>
      </div>
    </section>

    <div class="page-inner">
      <div class="divider tight"></div>
      <section id="products">
        <div class="grid">${cards||'<div class="empty">هنوز لباسی اضافه نشده ♡</div>'}</div>
      </section>
      <div class="divider"></div>
    </div>`;
  app.querySelectorAll(".product-card[data-name]").forEach(el=>{
    el.addEventListener("click",()=>{
      location.hash="/product/"+encodeURIComponent(el.dataset.name);
    });
  });
}

async function product(name){
  const p=products.find(x=>x.name===name);
  if(!p)return notFound();
  const x=await info(p);
  activeImages=p.images;activeIndex=0;
  app.innerHTML=`<div class="page-inner"><section class="detail">
    <a class="back" href="#/">← برگشت به کالکشن</a>
    <div class="detail-wrap">
      <div class="gallery">
        <div class="main-img" id="mainImg">${activeImages[0]?`<img src="${esc(activeImages[0])}" alt="">`:"<div style='height:100%;display:grid;place-items:center;font-size:100px'>👗</div>"}</div>
        <div class="thumbs">${activeImages.map((im,i)=>`<button class="thumb ${i===0?"active":""}" data-idx="${i}"><img src="${esc(im)}"></button>`).join("")}</div>
      </div>
      <div class="details">
        <div class="mini">ZELLAVIE / COLLECTION</div>
        <h1>${esc(x.title||p.name)}</h1>
        <div class="bigprice">${esc(x.price||"برای قیمت پیام بده ♡")}</div>
        <div class="desc">${x.html}</div>
        <div class="order-wrap" id="orderWrap">
          ${orderButtonsHTML()}
        </div>
      </div>
    </div>
  </section></div>`;
  app.querySelectorAll(".thumb[data-idx]").forEach(btn=>{
    btn.addEventListener("click",()=>showImg(Number(btn.dataset.idx)));
  });
  bindOrderButtons(document.getElementById("orderWrap"));
}
function showImg(i){
  activeIndex=i;
  document.getElementById("mainImg").innerHTML=`<img src="${esc(activeImages[i])}" alt="">`;
  document.querySelectorAll(".thumb").forEach((b,j)=>b.classList.toggle("active",j===i));
}

async function order(name){
  const p=products.find(x=>x.name===name);
  const title = p ? (p.info?.title || p.name) : name;
  app.innerHTML=`<div class="page-inner"><section class="order-page"><div class="order-box">
    <div style="font-size:55px">🎀</div>
    <div class="mini">ZELLAVIE / ORDER</div>
    <h1>سفارش ${esc(title)}</h1>
    <p style="color:#896878;line-height:2">برای ثبت سفارش، از یکی از راه‌های زیر با ما در ارتباط باش.</p>
    <div class="socials">
      <a class="social" href="${has(LINKS.bale)?esc(LINKS.bale):"javascript:void(0)"}" target="_blank" rel="noopener" ${has(LINKS.bale)?"":'data-disabled="1"'}>
        <b>${ICONS.bale}</b>بله<br><small>${has(LINKS.bale)?"ارتباط در بله":"در دست تعمیر"}</small>
      </a>
      <a class="social" href="${has(LINKS.instagram)?esc(LINKS.instagram):"javascript:void(0)"}" target="_blank" rel="noopener" ${has(LINKS.instagram)?"":'data-disabled="1"'}>
        <b>${ICONS.instagram}</b>اینستاگرام<br><small>${has(LINKS.instagram)?"ارتباط در اینستاگرام":"در دست تعمیر"}</small>
      </a>
    </div>
    <a class="back" style="display:block;margin-top:28px;color:#b65c7d" href="#/product/${encodeURIComponent(name)}">← بازگشت به محصول</a>
  </div></section></div>`;
  app.querySelectorAll('.social[data-disabled="1"]').forEach(el=>{
    el.addEventListener("click",e=>{e.preventDefault();alert(LINK_ERROR)});
  });
}

function notFound(){
  app.innerHTML = `
    <section id="notfound-container">
      <iframe src="404.html" title="404 — page not found"></iframe>
    </section>`;
  document.title = "404 — zellavie";
}

function route(){
  const r=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  if(!r.length)return home();
  if(r[0]==="product")return product(decodeURIComponent(r[1]||""));
  if(r[0]==="order")return order(decodeURIComponent(r[1]||""));
  return notFound()
}
async function init(){
  renderBg();
  renderFooter();
  try{
    const r=await fetch("tree.json");
    if(!r.ok) throw new Error("tree.json not found");
    tree=await r.json();
    parse();
    for(const p of products){ try{ await info(p) }catch(e){} }
  }catch(e){products=[]}
  route()
}
window.addEventListener("hashchange",route);
init();
</script>
</body></html>
