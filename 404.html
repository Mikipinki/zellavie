.content{
  position:relative;
  z-index:10;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1em;
  padding:24px;
  text-align:center;
  color:#fff;
  font-family:Vazirmatn,sans-serif;
}

.logo-404{
  width:clamp(200px, 42vw, 380px);
  height:auto;
  display:block;
  user-select:none;
  -webkit-user-drag:none;
}
.logo-404-fallback{display:none}

.code404{
  font-size:clamp(4rem,14vw,7rem);
  font-weight:900;
  letter-spacing:.08em;
  line-height:1;
  background:linear-gradient(180deg,#fff4c8 0%,#e8c46a 35%,#b8892c 70%,#8a5f14 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  text-shadow:0 0 45px rgba(232,196,106,.55);
}

.sub-en{
  font-size:.75rem;
  letter-spacing:.35em;
  color:#c9b47a;
  margin:0;
  font-weight:600;
}

.title-fa{
  font-size:clamp(1.25rem,3.5vw,1.9rem);
  font-weight:900;
  margin:.2em 0 0;
  color:#fff;
}

.desc-fa{
  font-size:.95rem;
  color:#bdbdd0;
  line-height:2;
  max-width:28em;
  margin:0;
  font-weight:500;
}

.btn-home{
  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:14px;
  background:#ed6f9e;
  color:#fff;
  text-decoration:none;
  padding:14px 34px;
  border-radius:999px;
  font-weight:900;
  font-size:.95rem;
  box-shadow:0 12px 30px rgba(237,111,158,.5);
  transition:.3s ease;
  cursor:pointer;
  border:0;
}
.btn-home:hover{
  transform:translateY(-3px);
  box-shadow:0 18px 40px rgba(237,111,158,.75);
}

.footer-404{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  z-index:11;
  text-align:center;
  padding:20px 16px 22px;
  border-top:1px solid rgba(255,255,255,.18);
  color:rgba(255,255,255,.9);
  font-family:Vazirmatn,sans-serif;
  font-size:12px;
}
.footer-404 .foot-socials{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
}
.footer-404 .foot-social{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:9px 16px;
  background:rgba(255,255,255,.92);
  color:#b83d78;
  border-radius:999px;
  font-weight:800;
  font-size:12px;
  text-decoration:none;
  transition:.25s;
  box-shadow:0 6px 16px rgba(0,0,0,.28);
}
.footer-404 .foot-social:hover{transform:translateY(-3px);background:#fff}
.footer-404 .foot-social svg{width:16px;height:16px;fill:#b83d78}

@media(max-width:520px){
  .content{gap:.85em;padding:18px}
  .logo-404{width:clamp(180px,60vw,240px)}
  .code404{font-size:3.6rem}
  .sub-en{letter-spacing:.25em;font-size:.65rem}
  .footer-404{padding:16px 12px 18px}
  .footer-404 .foot-social{padding:8px 12px;font-size:11px}
}

@keyframes animStar{
  from{transform:translateY(0px)}
  to{transform:translateY(-2000px)}
}
